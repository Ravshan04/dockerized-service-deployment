name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deployment
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.reference }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        env:
          SHA: ${{ github.sha }}
        run: echo "reference=${IMAGE_NAME}:${SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.reference }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy container
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          SECRET_MESSAGE: ${{ secrets.SECRET_MESSAGE }}
          APP_USERNAME: ${{ secrets.APP_USERNAME }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key "${SSH_USER}@${SERVER_HOST}" \
            "sudo docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key "${SSH_USER}@${SERVER_HOST}" \
            "sudo docker pull '$IMAGE'"
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key "${SSH_USER}@${SERVER_HOST}" \
            "sudo docker rm -f dockerized-service 2>/dev/null || true"
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key "${SSH_USER}@${SERVER_HOST}" \
            "sudo docker run -d --name dockerized-service --restart unless-stopped -p 127.0.0.1:3001:3000 \
            -e SECRET_MESSAGE='$SECRET_MESSAGE' -e USERNAME='$APP_USERNAME' -e PASSWORD='$APP_PASSWORD' '$IMAGE'"

      - name: Verify deployment
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: curl --fail --retry 10 --retry-delay 3 "http://${SERVER_HOST}/health"
